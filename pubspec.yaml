name: vlau_assessment
description: "News Feed - Flutter take-home task: paginated feed, debounced search, bookmarks, optimistic reactions, offline-first caching with a mutation outbox."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.7
  rxdart: ^0.28.0

  get_it: ^8.0.3

  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  path_provider: ^2.1.5

  connectivity_plus: ^6.1.4

  cached_network_image: ^3.4.1

  uuid: ^4.5.1

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/mock/
